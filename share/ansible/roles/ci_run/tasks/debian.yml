---
# tasks file for ci_run
- name: Ensure repos are updated
  ansible.builtin.raw: apt update

- name: Ensure python is installed
  ansible.builtin.raw: apt install python3 -y

- name: Ensure dependencies are installed
  ansible.builtin.apt:
    name:
      - btrfs-progs
      - expect
      - gpg
      - libbsd-dev
      - libcmocka-dev
      - libltdl-dev
      - pkgconf
      - vim
    state: present

- name: Gather selected facts
  ansible.builtin.setup:
    filter:
      - 'ansible_distribution_release'

- name: Add specified repository into sources list
  ansible.builtin.apt_repository:
    repo: deb-src http://deb.debian.org/debian {{ ansible_distribution_release }} main
    state: present

- name: Ensure build dependencies are installed
  ansible.builtin.apt:
    pkg: shadow
    state: build-dep

- name: Check if UID 1000 already exists
  ansible.builtin.getent:
    database: passwd
    key: 1000
  register: existing_uid_1000
  failed_when: false

- name: Create CI user to simulate cloud VM environment
  ansible.builtin.user:
    name: ci
    create_home: true
    shell: /bin/bash
  when: existing_uid_1000.ansible_facts.getent_passwd['1000'] is undefined

- name: Build configuration
  ansible.builtin.shell: |
    ./autogen.sh \
        --enable-man \
        --with-yescrypt \
        --without-selinux \
        > configure.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_configure
  failed_when: false

- name: Build
  ansible.builtin.shell: make -Orecurse -j4 > build.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_build
  failed_when: false

- name: Run unit-tests
  ansible.builtin.shell: make check > check.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_check
  failed_when: false

# make install fails with "File exists" on /sbin/nologin, which the base image
# already provides; install into a staging tree and apply it by hand instead.
- name: Install into a staging tree
  ansible.builtin.shell: |
    rm -rf /tmp/rootfs
    make install DESTDIR=/tmp/rootfs > install.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_install
  failed_when: false

# The targets are removed before extracting: tar(1) fails with ETXTBSY when it
# overwrites a running binary in place.  -U (--unlink-first) would do that for
# us, but it also unlinks the merged-/usr symlinks (/bin, /sbin, /lib) that
# --keep-directory-symlink is here to preserve, so do it explicitly.
- name: Apply the staging tree to the system
  ansible.builtin.shell: |
    exec > apply.log 2>&1
    set -euxo pipefail
    find /tmp/rootfs -not -type d -printf '/%P\n' \
    | sort > install-manifest.txt
    xargs -d '\n' -r rm -f -- < install-manifest.txt
    tar -C /tmp/rootfs -cf - . \
    | tar -C / -xpf - --keep-directory-symlink --no-overwrite-dir
    ldconfig
    test -x /bin/sh
  args:
    chdir: /usr/local/src/shadow/
    executable: /bin/bash
  register: ci_apply
  failed_when: false

- name: Copy logs
  ansible.builtin.fetch:
    src: '{{ item }}'
    dest: ./build-out/
    flat: yes
    fail_on_missing: false
  with_items:
    - "/usr/local/src/shadow/config.log"
    - "/usr/local/src/shadow/config.h"
    - "/usr/local/src/shadow/configure.log"
    - "/usr/local/src/shadow/build.log"
    - "/usr/local/src/shadow/check.log"
    - "/usr/local/src/shadow/install.log"
    - "/usr/local/src/shadow/apply.log"
    - "/usr/local/src/shadow/install-manifest.txt"
    - "/usr/local/src/shadow/tests/unit/test-suite.log"

- name: Copy configuration file for testing
  ansible.builtin.copy:
    src: /usr/local/src/shadow/tests/system/etc/login.defs
    dest: /etc/login.defs
    remote_src: yes

- name: Fail if any build step failed
  ansible.builtin.assert:
    that:
      - ci_configure.rc == 0
      - ci_build.rc == 0
      - ci_check.rc == 0
      - ci_install.rc == 0
      - ci_apply.rc == 0
    fail_msg: >-
      configure={{ ci_configure.rc }} build={{ ci_build.rc }}
      check={{ ci_check.rc }} install={{ ci_install.rc }}
      apply={{ ci_apply.rc }}
