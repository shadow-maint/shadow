---
# tasks file for ci_run
- name: Ensure repos are updated
  ansible.builtin.raw: apt update

- name: Ensure python is installed
  ansible.builtin.raw: apt install python3 -y

- name: Ensure dependencies are installed
  ansible.builtin.apt:
    name:
      - btrfs-progs
      - expect
      - gpg
      - libbsd-dev
      - libcmocka-dev
      - libltdl-dev
      - pkgconf
      - vim
    state: present

- name: Gather selected facts
  ansible.builtin.setup:
    filter:
      - 'ansible_distribution_release'

- name: Add specified repository into sources list
  ansible.builtin.apt_repository:
    repo: deb-src http://deb.debian.org/debian {{ ansible_distribution_release }} main
    state: present

- name: Ensure build dependencies are installed
  ansible.builtin.apt:
    pkg: shadow
    state: build-dep

- name: Check if UID 1000 already exists
  ansible.builtin.getent:
    database: passwd
    key: 1000
  register: existing_uid_1000
  failed_when: false

- name: Create CI user to simulate cloud VM environment
  ansible.builtin.user:
    name: ci
    create_home: true
    shell: /bin/bash
  when: existing_uid_1000.ansible_facts.getent_passwd['1000'] is undefined

- name: Build configuration
  ansible.builtin.shell: >
    ./autogen.sh
    --enable-man
    --with-yescrypt
    --without-selinux
    > configure.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_configure
  failed_when: false

- name: Build
  ansible.builtin.shell: make -Orecurse -j4 > build.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_build
  failed_when: false

- name: Run unit-tests
  ansible.builtin.shell: make check > check.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_check
  failed_when: false


- name: Diagnose the nologin collision
  ansible.builtin.shell: |
    ls -ld /sbin /usr/sbin
    ls -la /sbin/nologin /usr/sbin/nologin
    readlink /sbin/nologin
    stat /sbin/nologin; stat -L /sbin/nologin
    dpkg -S /sbin/nologin /usr/sbin/nologin
    findmnt -T /usr/sbin
    apt-get install -y strace > /dev/null
    strace -e trace=statx,newfstatat,openat,unlinkat,readlink \
        /usr/bin/install -c src/nologin /sbin/nologin
  args:
    chdir: /usr/local/src/shadow/
  register: ci_diag
  failed_when: false

- name: Show the diagnosis
  ansible.builtin.debug:
    msg: "{{ ci_diag.stdout_lines + ci_diag.stderr_lines }}"

- name: Install into a staging tree
  ansible.builtin.shell: |
    rm -rf /tmp/rootfs
    make install DESTDIR=/tmp/rootfs > install.log 2>&1
  args:
    chdir: /usr/local/src/shadow/
  register: ci_install
  failed_when: false

- name: Apply the staging tree to the system
  ansible.builtin.shell: |
    set -euo pipefail
    find /tmp/rootfs \( -type f -o -type l \) \
        | sed 's|^/tmp/rootfs||' | sort > install-manifest.txt
    while IFS= read -r f; do
        rm -f "$f"
    done < install-manifest.txt
    tar -C /tmp/rootfs -cf - . \
        | tar -C / -xpf - --keep-directory-symlink --no-overwrite-dir
    ldconfig
    test -x /bin/sh
  args:
    chdir: /usr/local/src/shadow/
    executable: /bin/bash
  register: ci_apply
  failed_when: false

- name: Copy configuration file for testing
  ansible.builtin.copy:
    src: /usr/local/src/shadow/tests/system/etc/login.defs
    dest: /etc/login.defs
    remote_src: yes

- name: Verify the system tests will exercise the binaries we just built
  ansible.builtin.shell: |
    set -eu
    built=src/useradd
    [ -f src/.libs/useradd ] && built=src/.libs/useradd
    found=$(command -v useradd)
    echo "built:   $built"
    echo "on PATH: $found"
    cmp -- "$built" "$found"
    echo "--- useradd -D ---"
    useradd -D
    echo "--- login.defs ---"
    grep -E '^[[:space:]]*(UID_MIN|UID_MAX|SYS_UID_MIN|SYS_UID_MAX)' /etc/login.defs
  args:
    chdir: /usr/local/src/shadow/
  register: ci_verify
  failed_when: false

- name: Copy logs
  ansible.builtin.fetch:
    src: '{{ item }}'
    dest: ./build-out/
    flat: yes
    fail_on_missing: false
  with_items:
    - "/usr/local/src/shadow/config.log"
    - "/usr/local/src/shadow/config.h"
    - "/usr/local/src/shadow/configure.log"
    - "/usr/local/src/shadow/build.log"
    - "/usr/local/src/shadow/check.log"
    - "/usr/local/src/shadow/install.log"
    - "/usr/local/src/shadow/install-manifest.txt"
    - "/usr/local/src/shadow/tests/unit/test-suite.log"

- name: Collect the tail of the logs that failed
  ansible.builtin.shell: |
    set -u
    dump() {
        [ "$2" -eq 0 ] && return 0
        printf '\n===== %s (rc=%s) =====\n' "$1" "$2"
        tail -n 60 "$1" 2>/dev/null || echo "(missing)"
    }
    dump install.log   {{ ci_install.rc }}
    dump check.log     {{ ci_check.rc }}
    dump build.log     {{ ci_build.rc }}
    dump configure.log {{ ci_configure.rc }}
  args:
    chdir: /usr/local/src/shadow/
  register: ci_logs
  failed_when: false
  when: >
    ci_configure.rc != 0 or ci_build.rc != 0 or ci_check.rc != 0
    or ci_install.rc != 0 or ci_apply.rc != 0 or ci_verify.rc != 0

- name: Show the apply and verification output
  ansible.builtin.debug:
    msg: "{{ ci_apply.stderr_lines | default([]) + ci_verify.stdout_lines | default([]) }}"
  when: >
    ci_configure.rc != 0 or ci_build.rc != 0 or ci_check.rc != 0
    or ci_install.rc != 0 or ci_apply.rc != 0 or ci_verify.rc != 0

- name: Show the logs of the steps that failed
  ansible.builtin.debug:
    var: ci_logs.stdout_lines
  when: >
    ci_configure.rc != 0 or ci_build.rc != 0 or ci_check.rc != 0
    or ci_install.rc != 0 or ci_apply.rc != 0 or ci_verify.rc != 0

- name: Fail if any build step failed
  ansible.builtin.fail:
    msg: "configure={{ ci_configure.rc }} build={{ ci_build.rc }} check={{ ci_check.rc }} install={{ ci_install.rc }} apply={{ ci_apply.rc }} verify={{ ci_verify.rc }}"
  when: >
    ci_configure.rc != 0 or ci_build.rc != 0 or ci_check.rc != 0
    or ci_install.rc != 0 or ci_apply.rc != 0 or ci_verify.rc != 0
